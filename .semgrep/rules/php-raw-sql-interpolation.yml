rules:
  - id: php.raw-sql-interpolation
    languages:
      - php
    severity: ERROR
    message: >-
      Do not concatenate or interpolate dynamic values into raw SQL. Use query-builder
      constraints or placeholders with a separate bindings array.
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      technology:
        - php
        - laravel
    pattern-regex: >-
      (?s)(?:DB::(?:select|insert|update|delete|statement|raw)|->(?:selectRaw|whereRaw|havingRaw|orderByRaw|groupByRaw))\s*\(\s*(?:"(?:[^"\\]|\\.)*\$[A-Za-z_{][^"\\]*"|'(?:[^'\\]|\\.)*'\s*\.\s*\$[A-Za-z_])
